[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Follow-along code for Build a Large Language Model (From Scratch)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "torch",
    "tiktoken",
    "numpy",
    # 5.5 only: the OpenAI weights ship as a TensorFlow checkpoint
    "tensorflow",
    "tqdm",
    "requests",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "configs*"]
